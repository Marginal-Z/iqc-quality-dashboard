<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初始化 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><script type="module" src="/auth/setup.js"></script></head>
<body><main class="login-shell"><section class="login-card" aria-labelledby="title"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small>IQC 来料检验看板</small></div></div><h1 id="title" data-auth-text="setupTitle">建立管理员账号</h1><p class="intro" data-auth-text="setupIntro"></p><form id="setupForm">
<div class="field"><label for="username" data-auth-text="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-zA-Z0-9][a-zA-Z0-9._@\-]{2,63}" required aria-describedby="usernameHint"><p class="hint" id="usernameHint" data-auth-text="usernameHint"></p></div>
<div class="field"><label for="displayName" data-auth-text="displayName">显示名称</label><input id="displayName" name="displayName" autocomplete="name" maxlength="80" required></div>
<div class="field"><label for="password" data-auth-text="newPassword">新密码</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="256" required aria-describedby="passwordHint"><button type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false" data-auth-text="show">显示</button></div><p class="hint" id="passwordHint" data-auth-text="passwordHint"></p></div>
<div class="field"><label for="confirmPassword" data-auth-text="confirmPassword">确认密码</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="256" required></div><p class="message" role="alert" hidden></p><button class="primary" type="submit" data-auth-text="setupSubmit">建立管理员并进入看板</button></form><div class="login-foot"><span data-auth-text="setupFooter"></span><div class="language"><label for="language" data-auth-text="language">语言</label><select id="language" data-auth-language><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option></select></div></div></section></main></body></html>
