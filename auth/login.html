<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><script type="module" src="/auth/login.js"></script></head>
<body><main class="login-shell"><section class="login-card" aria-labelledby="title"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small>IQC 来料检验看板</small></div></div><h1 id="title" data-auth-text="title">账号登录</h1><p class="intro" data-auth-text="intro"></p>
<form id="loginForm"><div class="field"><label for="username" data-auth-text="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" required></div><div class="field"><label for="password" data-auth-text="password">密码</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false" data-auth-text="show">显示</button></div></div><p class="message" role="alert" hidden></p><button class="primary" type="submit" data-auth-text="submit">登录看板</button></form>
<div class="login-foot"><span data-auth-text="footer"></span><div class="language"><label for="language" data-auth-text="language">语言</label><select id="language" data-auth-language><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option></select></div></div></section></main></body></html>
