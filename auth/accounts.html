<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><script type="module" src="/auth/accounts.js"></script></head>
<body><main class="accounts-shell"><header class="accounts-header"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small>IQC 来料检验看板</small></div></div><nav><a class="button" href="/" data-auth-text="back">返回看板</a><button id="logout" data-auth-text="logout">退出登录</button><select data-auth-language aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option></select></nav></header>
<div class="page-heading"><div><h1 data-auth-text="accounts">账号管理</h1><p data-auth-text="accountsIntro"></p></div><button class="primary" id="addUser" data-auth-text="add" disabled>新增账号</button></div><p id="status" class="message" role="status" hidden></p><div class="table-panel"><table><thead><tr><th data-auth-text="username">账号</th><th data-auth-text="displayName">显示名称</th><th data-auth-text="role">权限</th><th data-auth-text="status">状态</th><th data-auth-text="actions">操作</th></tr></thead><tbody id="users"><tr><td colspan="5" class="empty" data-auth-text="busy">正在处理…</td></tr></tbody></table></div>
<dialog id="userDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle" data-auth-text="add">新增账号</h2><form id="userForm"><div id="newUserFields"><div class="field"><label for="username" data-auth-text="username">账号</label><input id="username" name="username" autocomplete="off" autocapitalize="none" spellcheck="false" pattern="[a-zA-Z0-9][a-zA-Z0-9._@\-]{2,63}" required><p class="hint" data-auth-text="usernameHint"></p></div><div class="field"><label for="displayName" data-auth-text="displayName">显示名称</label><input id="displayName" name="displayName" maxlength="80" required></div><div class="field"><label for="role" data-auth-text="role">权限</label><select id="role" name="role"><option value="viewer" data-auth-text="viewer">查看者</option><option value="admin" data-auth-text="admin">管理员</option></select></div></div><p class="intro" id="resetHint" data-auth-text="resetHint" hidden></p><div class="field"><label for="password" data-auth-text="newPassword">新密码</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="256" required><button type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false" data-auth-text="show">显示</button></div><p class="hint" data-auth-text="passwordHint"></p></div><p class="message" role="alert" hidden></p><div class="actions"><button type="button" id="cancelUser" data-auth-text="cancel">取消</button><button class="primary" type="submit" data-auth-text="save">保存</button></div></form></dialog></main></body></html>
