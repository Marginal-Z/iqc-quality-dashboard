<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人提醒 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><link rel="stylesheet" href="/auth/reminders.css"><script type="module" src="/auth/reminders.js"></script></head>
<body><main class="accounts-shell"><header class="accounts-header"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small>IQC 来料检验看板</small></div></div><nav><a class="button" href="/" data-auth-text="back">返回看板</a><a class="button" href="/accounts" data-auth-text="accounts">账号管理</a><select data-auth-language aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option></select></nav></header>
<div class="page-heading"><div><h1 data-auth-text="reminders">机器人提醒</h1><p data-auth-text="reminderIntro"></p></div><span class="badge">Asia/Bangkok · UTC+7</span></div>
<p id="pageStatus" class="message" role="status" data-auth-text="busy">正在处理…</p>
<form id="reminderForm"><section class="reminder-panel" aria-labelledby="botTitle"><div class="section-heading"><h2 id="botTitle" data-auth-text="botTitle"></h2><span id="connectionBadge" class="badge" role="status"></span></div><p class="intro" data-auth-text="botHint"></p>
<div class="reminder-fields"><div class="field"><label for="appId">App ID</label><input id="appId" name="appId" autocomplete="off" spellcheck="false" pattern="cli_[A-Za-z0-9_\-]{4,100}" maxlength="104"></div><div class="field"><label for="appSecret">App Secret</label><input id="appSecret" name="appSecret" type="password" autocomplete="new-password" maxlength="256" aria-describedby="secretHint"><p id="secretHint" class="hint" data-auth-text="secretHint"></p></div></div>
<div class="actions"><button type="button" id="checkConnection" data-auth-text="checkConnection" disabled></button><span class="hint" data-auth-text="connectionHint"></span></div></section>
<section class="reminder-panel" aria-labelledby="ruleTitle"><h2 id="ruleTitle" data-auth-text="ruleTitle"></h2><p class="intro" data-auth-text="ruleHint"></p><label class="enable-label"><input id="reminderEnabled" type="checkbox"><span data-auth-text="enableReminders"></span></label><p class="hint" data-auth-text="enableHint"></p>
<div class="field start-field"><label for="dailyStart" data-auth-text="dailyStart"></label><input id="dailyStart" type="time" value="00:00" required aria-describedby="startHint"><p id="startHint" class="hint" data-auth-text="startHint"></p></div>
<fieldset class="factory-fieldset"><legend data-auth-text="selectedFactories"></legend><div id="reminderFactories" class="factory-options"></div></fieldset></section>
<section class="reminder-panel" aria-labelledby="recipientsTitle"><div class="section-heading"><h2 id="recipientsTitle" data-auth-text="recipientsTitle"></h2><button id="addRecipient" type="button" data-auth-text="addRecipient" disabled></button></div><p class="intro" data-auth-text="recipientsHint"></p><div id="recipientRows"></div><p class="hint"><a href="https://open.feishu.cn/document/uAjLw4CM/ugTN1YjL4UTN24CO1UjN/trouble-shooting/how-to-obtain-openid" target="_blank" rel="noreferrer" data-auth-text="openIdHelp"></a></p></section>
<div class="save-bar"><p class="message" role="alert" hidden></p><button class="primary" type="submit" id="saveReminders" data-auth-text="save" disabled>保存</button></div></form>
<section class="reminder-panel"><div class="section-heading"><h2 data-auth-text="previewTitle"></h2><button type="button" id="previewReminders" data-auth-text="preview" disabled></button></div><p class="hint" data-auth-text="previewHint"></p><div id="reminderPreview" hidden></div></section>
<section class="reminder-panel"><div class="section-heading"><h2 data-auth-text="historyTitle"></h2><button type="button" id="refreshHistory" data-auth-text="refreshHistory" disabled></button></div><p id="lastCheck" class="hint"></p><div class="table-panel"><table><thead><tr><th data-auth-text="day"></th><th data-auth-text="inspector"></th><th data-auth-text="pendingCount"></th><th data-auth-text="status"></th><th data-auth-text="sentAt"></th></tr></thead><tbody id="deliveryHistory"></tbody></table></div></section>
</main></body></html>
