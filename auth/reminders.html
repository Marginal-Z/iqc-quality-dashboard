<!doctype html>
<html lang="zh" translate="no" class="notranslate">
<head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置中心 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><link rel="stylesheet" href="/auth/reminders.css"><link rel="stylesheet" href="/auth/settings.css"><script type="module" src="/auth/reminders.js"></script></head>
<body class="settings-layout">
<nav id="settingsNavigation" class="settings-navigation" aria-label="设置中心"></nav>
<div class="settings-workspace">
<header class="settings-topbar"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small data-auth-text="dashboardName">IQC 来料检验看板</small></div></div><a class="button" href="/" data-auth-text="back">返回看板</a></header>
<main class="settings-content">
<div class="page-heading"><div><h1 id="viewTitle">设置中心</h1><p id="viewIntro"></p></div><span class="badge">Asia/Bangkok</span></div>
<p id="pageStatus" class="message" role="status" hidden></p>

<section data-view="general" class="settings-surface" hidden>
  <div class="settings-section settings-form"><h2 data-auth-text="language">语言</h2><select data-auth-language aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option><option value="mix">中文 + ไทย</option><option value="en-th">English + ไทย</option></select><p class="hint" data-auth-text="languageHint"></p></div>
  <div class="settings-section"><h2 data-auth-text="account">当前账号</h2><p id="currentAccount"></p><button id="logout" type="button" data-auth-text="logout">退出登录</button></div>
  <div class="settings-section settings-form"><h2 data-auth-text="accountSecurity">账号安全</h2><form id="passwordForm"><div class="field"><label for="currentPassword" data-auth-text="currentPassword"></label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="256" required></div><div class="field"><label for="password" data-auth-text="newPassword"></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required><p class="hint" data-auth-text="passwordHint"></p></div><div class="field"><label for="confirmPassword" data-auth-text="passwordConfirm"></label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></div><p class="message" role="alert" hidden></p><button class="primary" type="submit" data-auth-text="change"></button></form></div>
</section>

<section data-view="employees" hidden>
  <div class="settings-toolbar"><input id="employeeFilter" type="search" aria-label="筛选员工"><button id="addEmployee" class="primary" type="button" data-auth-text="employeeAdd" disabled>添加员工</button></div>
  <div class="table-panel"><table><thead><tr><th data-auth-text="employeeName"></th><th data-auth-text="factory"></th><th data-auth-text="employeeAliases"></th><th data-auth-text="notificationType"></th><th data-auth-text="actions"></th></tr></thead><tbody id="employeeRows"></tbody></table></div>
  <p class="hint" data-auth-text="employeeScope"></p><p id="directoryStatus" class="message" role="status" hidden></p>
</section>

<section data-view="notifications" hidden>
  <div class="settings-tabs" role="tablist" aria-label="通知类型"><button role="tab" id="inspectorTab" aria-controls="inspectorPanel" aria-selected="true" data-auth-text="inspectorTab"></button><button role="tab" id="warehouseTab" aria-controls="warehousePanel" aria-selected="false" tabindex="-1" data-auth-text="warehouseTab"></button></div>
  <section id="inspectorPanel" class="settings-surface" role="tabpanel" aria-labelledby="inspectorTab"><form id="rulesForm" class="settings-form"><h2 data-auth-text="inspectorTab"></h2><p class="settings-note" data-auth-text="connectionDescription"></p><label class="enable-label"><input id="reminderEnabled" type="checkbox"><span data-auth-text="enableReminders"></span></label><p class="hint" data-auth-text="enableHint"></p><div class="field start-field"><label for="dailyStart" data-auth-text="dailyStart"></label><input id="dailyStart" type="time" value="00:00" required><p class="hint" data-auth-text="startHint"></p></div><fieldset class="factory-fieldset"><legend data-auth-text="selectedFactories"></legend><div id="reminderFactories" class="factory-options"></div></fieldset><p class="message" role="alert" hidden></p><div class="settings-actions"><button class="primary" type="submit" data-auth-text="saveRules" disabled></button></div></form></section>
  <section id="warehousePanel" class="settings-surface" role="tabpanel" aria-labelledby="warehouseTab" hidden><form id="warehouseForm" class="settings-form"><h2 data-auth-text="warehouseTab"></h2><p class="intro" data-auth-text="warehouseHint"></p><p class="factory-thailand"><strong>SHARETRONIC Thailand</strong></p><label class="enable-label"><input id="warehouseEnabled" type="checkbox"><span data-auth-text="warehouseEnabled"></span></label><div class="recipient-choice"><div id="warehousePerson"></div><button id="chooseWarehouse" type="button" data-auth-text="warehouseChoose" disabled></button></div><p id="warehouseMeta" class="hint"></p><p class="message" role="alert" hidden></p><div class="settings-actions"><button class="primary" type="submit" data-auth-text="saveWarehouse" disabled></button></div></form></section>
</section>

<section data-view="history" hidden>
  <div class="settings-toolbar"><div class="settings-tabs" role="tablist" aria-label="通知类型"><button role="tab" id="inspectorHistoryTab" aria-controls="inspectorHistoryPanel" aria-selected="true" data-auth-text="inspectorTab"></button><button role="tab" id="warehouseHistoryTab" aria-controls="warehouseHistoryPanel" aria-selected="false" tabindex="-1" data-auth-text="warehouseTab"></button></div><button id="refreshHistory" type="button" data-auth-text="refreshHistory"></button></div>
  <section id="inspectorHistoryPanel" role="tabpanel" aria-labelledby="inspectorHistoryTab"><p id="lastCheck" class="hint"></p><p id="reminderDiagnostics" class="hint reminder-diagnostics"></p><div class="table-panel"><table><thead><tr><th data-auth-text="day"></th><th data-auth-text="inspector"></th><th data-auth-text="pendingCount"></th><th data-auth-text="status"></th><th data-auth-text="sentAt"></th></tr></thead><tbody id="deliveryHistory"></tbody></table></div><div class="settings-actions"><button type="button" id="previewReminders" data-auth-text="preview"></button></div><p class="hint" data-auth-text="previewHint"></p><div id="reminderPreview" hidden></div></section>
  <section id="warehouseHistoryPanel" role="tabpanel" aria-labelledby="warehouseHistoryTab" hidden><div class="table-panel"><table><thead><tr><th data-auth-text="pendingCount"></th><th data-auth-text="status"></th><th data-auth-text="sentAt"></th><th data-auth-text="errorDetails"></th></tr></thead><tbody id="warehouseHistory"></tbody></table></div></section>
</section>

<section data-view="connection" class="settings-surface" hidden><form id="connectionForm" class="settings-form"><div class="section-heading"><h2 data-auth-text="botTitle"></h2><span id="connectionBadge" class="badge"></span></div><p class="intro" data-auth-text="connectionIntro"></p><div class="field"><label for="appId">App ID</label><input id="appId" name="appId" autocomplete="off" spellcheck="false" pattern="cli_[A-Za-z0-9_\-]{4,100}" maxlength="104" required></div><div class="field"><label for="appSecret">App Secret</label><input id="appSecret" name="appSecret" type="password" autocomplete="new-password" maxlength="256"><p class="hint" data-auth-text="secretHint"></p></div><p class="message" role="alert" hidden></p><div class="settings-actions"><button class="primary" type="submit" data-auth-text="saveConnection" disabled></button><button type="button" id="checkConnection" data-auth-text="checkConnection" disabled></button></div><p class="hint" data-auth-text="connectionHint"></p></form></section>
</main>
</div>

<dialog id="employeeDialog" class="employee-dialog" aria-labelledby="employeeDialogTitle"><div class="dialog-heading"><h2 id="employeeDialogTitle" data-auth-text="employeeAdd"></h2><button id="closeEmployeeDialog" type="button" aria-label="关闭">×</button></div><form id="employeeForm"><div class="field"><label for="employeeSearch" data-auth-text="employeeName"></label><input id="employeeSearch" type="search" autocomplete="off" maxlength="160" aria-controls="employeeResults"><div id="employeeResults" class="employee-results" role="group" aria-label="员工搜索结果"></div><p id="employeeSelection" class="hint" role="status"></p></div><div id="employeeMappingFields"><div class="field"><label for="employeeFactory" data-auth-text="factory"></label><select id="employeeFactory"></select></div><details id="employeeAliasesDetails"><summary data-auth-text="qmsAliases"></summary><label for="employeeAliases" class="hint" data-auth-text="qmsAliasesHint"></label><textarea id="employeeAliases" rows="3" maxlength="800"></textarea></details></div><p id="employeeDialogStatus" class="message" role="alert" hidden></p><div class="actions"><button type="button" id="cancelEmployee" data-auth-text="cancel"></button><button type="submit" class="primary" data-auth-text="save" disabled></button></div></form></dialog>
<dialog id="removeEmployeeDialog" aria-labelledby="removeEmployeeTitle"><h2 id="removeEmployeeTitle" data-auth-text="employeeRemove"></h2><p id="removeEmployeeName"></p><p data-auth-text="employeeRemoveConfirm"></p><form id="removeEmployeeForm"><p class="message" role="alert" hidden></p><div class="actions"><button type="button" id="cancelRemoveEmployee" data-auth-text="cancel"></button><button type="submit" class="primary" data-auth-text="employeeRemove"></button></div></form></dialog>
</body></html>
