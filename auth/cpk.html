<!doctype html>
<html lang="zh" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cpk 分析 · IQC</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth/auth.css"><link rel="stylesheet" href="/auth/cpk.css"><script src="/echarts.min.js" defer></script><script type="module" src="/auth/cpk.js"></script></head>
<body><main class="accounts-shell cpk-shell"><header class="accounts-header"><div class="brand"><img src="/assets/favicon.svg" alt=""><div>SHARETRONIC<small data-auth-text="dashboardName">IQC 来料检验看板</small></div></div><nav><a class="button" href="/" data-auth-text="back">返回看板</a><select data-auth-language aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="th">ไทย</option><option value="mix">中文 + ไทย</option><option value="en-th">English + ไทย</option></select></nav></header>
<div class="page-heading"><div><h1 data-auth-text="cpkTitle">Cpk 分析</h1><p data-auth-text="cpkIntro"></p></div></div>
<form id="cpkForm" class="cpk-filter"><div class="field"><label for="factory" data-auth-text="factory"></label><select id="factory" required disabled><option value="">—</option></select></div><div class="field"><label for="material" data-auth-text="material"></label><input id="material" required maxlength="80" pattern="[a-zA-Z0-9._\-]+" autocomplete="off"></div><div class="field"><label for="startDate" data-auth-text="startDate"></label><input id="startDate" type="date" required></div><div class="field"><label for="endDate" data-auth-text="endDate"></label><input id="endDate" type="date" required></div><button class="primary" type="submit" id="analyze" data-auth-text="analyze" disabled></button><p class="hint" data-auth-text="rangeHint"></p></form>
<p class="cpk-scope" data-auth-text="scopeNote"></p><p id="cpkStatus" class="message" role="status" data-auth-text="initial"></p>
<section id="analysis" hidden><div class="cpk-selector"><label for="project" data-auth-text="project"></label><select id="project"></select><span id="reportSummary"></span></div><div id="issues" class="cpk-issues" role="status"></div><dl class="cpk-metrics" id="metrics"></dl><div class="cpk-charts"><section><h2 data-auth-text="distribution"></h2><div id="histogram" class="cpk-chart" role="img" aria-label="Measurement distribution"></div></section><section><h2 data-auth-text="sequence"></h2><div id="sequence" class="cpk-chart" role="img" aria-label="Measurement trend"></div></section></div><p class="hint" data-auth-text="method"></p><div class="table-panel"><table><thead><tr><th data-auth-text="material"></th><th data-auth-text="supplier"></th><th data-auth-text="specification"></th><th data-auth-text="within"></th><th data-auth-text="overall"></th><th data-auth-text="cp"></th><th data-auth-text="pp"></th></tr></thead><tbody id="details"></tbody></table></div></section>
</main></body></html>
