name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/dashboard.js
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.cjs
      - run: node scripts/build.mjs
      - run: node scripts/build-auth.mjs
      - run: git diff --check
