name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      access_protection_ready:
        description: Confirm both the Pages hostname and iqc.namecheap.xin are protected by the @sharetronic.com Access policy
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify access policy is ready
        env:
          ACCESS_PROTECTION_READY: ${{ inputs.access_protection_ready }}
        run: |
          if [ "$ACCESS_PROTECTION_READY" != "true" ]; then
            echo "Refusing to publish production data before Cloudflare Access is configured."
            exit 1
          fi
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.cjs
      - run: node scripts/build.mjs
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=iqc-quality-dashboard --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
